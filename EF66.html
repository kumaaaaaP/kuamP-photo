<!DOCTYPE html>
<html lang="ja">
<head>

<h2 class="page-title">EF66</h2>


<div class="aff-tabs">
    <button type="button" class="aff-tab-btn active" data-target="aff-suita">吹田</button>
  </div>
<div class="affiliation-block tab-panel" id="aff-suita">
  <h3>吹田</h3>
  <div class="train-group">
    <span class="tag-label">100番台</span>
    <div class="train-buttons">
      <span class="train-btn unshot" title="未撮影">119</span>
      <span class="train-btn unshot" title="未撮影">121</span>
      <span class="train-btn unshot" title="未撮影">122</span>
      <span class="train-btn unshot" title="未撮影">123</span>
      <span class="train-btn unshot" title="未撮影">124</span>
      <a class="train-btn shot" href="jr-freight/suita/EF66-125.html">125</a>
      <span class="train-btn unshot" title="未撮影">126</span>
      <span class="train-btn unshot" title="未撮影">127</span>

  </div>
</div>

<div class="legend">
  <span><span class="swatch" style="background:#e6f0ff;border-color:#b7d3f7"></span>撮影済み</span>
  <span><span class="swatch" style="background:#fff"></span>未撮影</span>
  <span><span class="swatch" style="background:#e5e5e5"></span>非現存</span>
</div>
<script>
document.querySelectorAll(".aff-tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".aff-tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.hidden = true);
    btn.classList.add("active");
    document.getElementById(btn.dataset.target).hidden = false;
  });
});
</script>

<nav class="breadcrumb bottom-breadcrumb"><a href="index.html">ホーム</a><span class="sep">&gt;</span><a href="jr-freight.html">JR貨物</a><span class="sep">&gt;</span><strong>EF66</strong></nav>
</div>
